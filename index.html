<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LYNRED | 赤外線センシングの未来を定義する</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --brand-red: #b22222;
            --dark-bg: #0a0f18;
            --card-bg: #161c27;
            --text-main: #e0e0e0;
            --text-sub: #a0a0a0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-main);
            margin: 0;
            line-height: 1.8;
        }

        /* Hero Section */
        header {
            height: 80vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(rgba(10,15,24,0.7), rgba(10,15,24,0.7)), url('hero-bg.jpg') center/cover; /* 適宜背景画像を */
            padding: 0 20px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            letter-spacing: 0.1em;
            background: linear-gradient(to right, #fff, var(--brand-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Report Summary Card */
        .summary-card {
            max-width: 900px;
            margin: -100px auto 50px;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            border-top: 4px solid var(--brand-red);
        }

        .summary-card h2 { color: var(--brand-red); font-size: 1.5rem; }

        /* Product Grid */
        .container { max-width: 1100px; margin: 0 auto; padding: 40px 20px; }

        .product-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin-bottom: 100px;
            align-items: center;
        }

        .product-section:nth-child(even) { direction: rtl; }
        .product-section:nth-child(even) .product-info { direction: ltr; }

        .img-container {
            background: #fff; /* 製品画像を引き立てるため白背景のカードに */
            padding: 30px;
            border-radius: 20px;
            transition: transform 0.3s ease;
        }

        .img-container:hover { transform: translateY(-10px); }

        .img-container img { width: 100%; height: auto; }

        .spec-badge {
            display: inline-block;
            background: rgba(178, 34, 34, 0.2);
            color: var(--brand-red);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .feature-list { list-style: none; padding: 0; }
        .feature-list li {
            position: relative;
            padding-left: 25px;
            margin-bottom: 12px;
            color: var(--text-sub);
        }
        .feature-list li::before {
            content: '▶';
            position: absolute;
            left: 0;
            color: var(--brand-red);
            font-size: 0.8rem;
        }

        /* Comparison Section */
        .comparison-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: var(--card-bg);
        }
        .comparison-table th, .comparison-table td {
            padding: 20px;
            border: 1px solid #2a3241;
            text-align: center;
        }
        .comparison-table th { background: #1a2230; color: var(--brand-red); }

        footer {
            text-align: center;
            padding: 80px 20px;
            background: #05080d;
        }

        .btn-contact {
            background: var(--brand-red);
            color: white;
            padding: 15px 40px;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: 0.3s;
        }
